; ============================================================
; Pengaturan dwg2cnc  (NC1 -> G-code FLSK F2100B)
; Ubah angka di bawah, simpan, lalu jalankan KONVERSI.bat lagi.
; ============================================================
[settings]

; G91 = koordinat inkremental (format FastCAM, default mesin "Relative")
; G90 = koordinat absolut
mode = G91

; G41 = kompensasi kerf memakai parameter Kerf di mesin (tombol Z, mis. 1.50)
; NONE = tanpa kompensasi (ukuran part akan kurang setengah lebar kerf)
kerf = G41

; cut  = lubang ikut dipotong
; skip = hanya kontur luar (lubang dibor terpisah)
holes = cut

; lubang dengan diameter lebih kecil dari ini (mm) dilewati. 0 = potong semua
min_hole_diameter = 0

; panjang lead-in kontur luar (mm) - titik tembus di luar part
lead_in_outer = 8

; lead-in untuk lubang yang bukan lingkaran (slot, kotak) (mm)
lead_in_hole = 6

; lubang bulat dengan jari-jari <= nilai ini ditembus tepat di titik tengahnya
center_pierce_max_radius = 30

; titik mulai potong (torch menyala): corner = di sudut, edge = di tengah sisi terpanjang
start_point = corner

; panjang lead-out ke arah scrap (mm). 0 = tanpa lead-out
lead_out = 5

; posisi part dari titik nol torch (mm). Torch diletakkan di pojok kiri bawah plat.
offset_x = 15
offset_y = 15

; kembali ke titik nol setelah selesai (yes/no)
return_home = yes

; jumlah angka desimal
decimals = 3

; ekstensi file output: .TXT atau .CNC
ext = .TXT

; baris komentar (NAMA PART ...) di awal file (yes/no)
header_comment = yes

; layer yang diabaikan (pisahkan koma, boleh pakai *)
ignore_layers = TEXT,DEFPOINTS,SCRIBE,DIM*,*DIMENSION*,MARK*,TITLE*

; kalau diisi, HANYA layer ini yang dipotong (mis. CUT,27). Kosong = semua layer.
cut_layers =

; toleransi sambung ujung garis yang tidak rapat (mm)
join_tolerance = 0.05

; kecepatan potong (mm/menit) - hanya untuk estimasi waktu di preview
cut_speed = 360

; buat gambar preview PNG (yes/no)
preview = yes

; pembaca DWG: auto | libredwg | oda
converter = auto
